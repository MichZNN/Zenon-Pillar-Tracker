<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>Login · Zenon Pillar Tracker</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/favicon-180.png">
  <link rel="icon" href="/static/icons/favicon.ico">
  <link rel="manifest" href="/static/icons/site.webmanifest">
  <link rel="stylesheet" href="/static/vendor/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card section-block">
      <div class="auth-brand" aria-hidden="true">
        <span class="auth-brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
        <span>Zenon Pillar Tracker</span>
      </div>
      <p class="eyebrow">Secure access</p>
      <h1>Welcome back</h1>
      <p class="muted">Login to manage your pillar subscriptions.</p>
      <form id="login-form" class="form-stack auth-form">
        <div class="auth-input-wrap">
          <i class="fa-solid fa-user auth-input-icon" aria-hidden="true"></i>
          <input name="username" aria-label="Username" placeholder="Username" autocomplete="username" required>
        </div>
        <div class="auth-input-wrap">
          <i class="fa-solid fa-lock auth-input-icon" aria-hidden="true"></i>
          <input id="login-password" name="password" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password" required>
          <button id="toggle-login-password" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
        <button class="primary-button" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Login</button>
      </form>
      <p id="login-message" class="form-message" role="status"></p>
      <a class="muted" href="/">Back to dashboard</a>
    </section>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
