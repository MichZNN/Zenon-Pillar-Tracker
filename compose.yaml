services:
  web:
    image: ${IMAGE:-ghcr.io/michznn/zenon-pillar-tracker:main}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      COLLECTOR_CONTROL_SOCKET: /run/zenon-control/collector.sock
    command:
      - python
      - web_app.py
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --database
      - /app/data_store/pillar_tracker.sqlite3
    volumes:
      - ${DATA_DIR:-./data_store}:/app/data_store
      - ./control:/run/zenon-control
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  collector:
    # The production deployment enables this profile. Development deploys the
    # web service only, so it cannot start a second data collector by accident.
    profiles:
      - collector
    image: ${IMAGE:-ghcr.io/michznn/zenon-pillar-tracker:main}
    restart: unless-stopped
    init: true
    # Runtime settings may point at a node RPC proxy on the host loopback.
    # Host networking keeps 127.0.0.1 meaningful for the collector on Linux.
    network_mode: host
    env_file:
      - .env
    command:
      - python
      - pillar_tracker.py
      - --database
      - /app/data_store/pillar_tracker.sqlite3
      - --loop
    volumes:
      - ${DATA_DIR:-./data_store}:/app/data_store
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    # The image healthcheck targets the web API and does not apply to the
    # collector process.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
