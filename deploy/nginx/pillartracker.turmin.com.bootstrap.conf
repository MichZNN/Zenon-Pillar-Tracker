# Temporary HTTP-only NGINX configuration for the first Let's Encrypt request.
# Replace this file with pillartracker.turmin.com.conf after the certificate
# has been issued.

upstream pillartracker_development {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name pillartracker.turmin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://pillartracker_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
