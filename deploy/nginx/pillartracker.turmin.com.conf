# NGINX reverse proxy for the production deployment.
# The production Compose stack listens on 127.0.0.1:8080.

upstream pillartracker_production {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name pillartracker.turmin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pillartracker.turmin.com;

    ssl_certificate /etc/letsencrypt/live/pillartracker.turmin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pillartracker.turmin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://pillartracker_production;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
