<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Pillar Tracker Telegram Logo</title>
  <desc>Three Zenon pillars tracked by a bold radar sweep, optimized for small circular avatars.</desc>
  <rect width="1024" height="1024" fill="#151515"/>

  <defs>
    <g id="pillar">
      <polygon points="-150,-5 0,70 0,370 -150,295" fill="#242424"/>
      <polygon points="0,70 150,-5 150,295 0,370" fill="#101010"/>

      <polygon points="-150,96 0,171 0,198 -150,123" fill="#6FF34D"/>
      <polygon points="0,171 150,96 150,123 0,198" fill="#00D557"/>
      <polygon points="-150,148 0,223 0,250 -150,175" fill="#6FF34D"/>
      <polygon points="0,223 150,148 150,175 0,250" fill="#00D557"/>
      <polygon points="-150,200 0,275 0,302 -150,227" fill="#6FF34D"/>
      <polygon points="0,275 150,200 150,227 0,302" fill="#00D557"/>

      <polygon points="0,-80 150,-5 0,70 -150,-5" fill="#303030" stroke="#404040" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="0,-50 94,-3 0,44 -94,-3" fill="#090909"/>
      <polygon points="0,-29 50,-3 0,23 -50,-3" fill="#6FF34D"/>
      <polyline points="-150,-5 0,70 150,-5" fill="none" stroke="#383838" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Bold radar geometry: deliberately sparse for Telegram-scale rendering. -->
  <circle cx="512" cy="512" r="382" fill="none" stroke="#6FF34D" stroke-width="44"/>
  <path d="M 512 510 L 690 178 Q 808 230 864 350 Z" fill="#0061EB"/>
  <path d="M 306 512 A 222 222 0 0 1 735 432" fill="none" stroke="#6FF34D" stroke-width="36" stroke-linecap="round"/>
  <path d="M 320 630 A 230 230 0 0 0 444 754" fill="none" stroke="#00D557" stroke-width="36" stroke-linecap="round"/>

  <!-- Tracked network pillars. -->
  <g transform="translate(278 365) scale(.52)"><use xlink:href="#pillar"/></g>
  <g transform="translate(758 388) scale(.52)"><use xlink:href="#pillar"/></g>
  <g transform="translate(512 425)"><use xlink:href="#pillar"/></g>

  <!-- Large radar pings interrupt the ring cleanly. -->
  <circle cx="512" cy="130" r="45" fill="#151515"/>
  <circle cx="512" cy="130" r="31" fill="#6FF34D"/>
  <circle cx="187" cy="713" r="48" fill="#151515"/>
  <circle cx="187" cy="713" r="33" fill="#F91690"/>
  <circle cx="842" cy="707" r="48" fill="#151515"/>
  <circle cx="842" cy="707" r="33" fill="#6FF34D"/>
</svg>
